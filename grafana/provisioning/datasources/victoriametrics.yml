apiVersion: 1

datasources:
  # VictoriaMetrics speaks the Prometheus query API, so the built-in Prometheus
  # datasource type works with no extra plugin.
  - name: VictoriaMetrics
    uid: victoriametrics
    type: prometheus
    access: proxy
    url: http://victoriametrics:8428
    isDefault: false
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
